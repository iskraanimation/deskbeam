[package]
name = "deskbeam-lan"
description = "LAN mode: a virtual network between paired devices over iroh (ported from iroh-lan)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
blake3 = "1.8"
bytes = "1"
getrandom = "0.3"
iroh = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# The virtual network adapter (utun on macOS, /dev/net/tun on Linux, wintun on Windows).
tun-rs = { version = "2.8", features = ["async"] }

[target.'cfg(windows)'.dependencies]
# Starts the helper with administrator rights (the UAC prompt).
runas = "1.2"

[dev-dependencies]
tokio = { workspace = true }
