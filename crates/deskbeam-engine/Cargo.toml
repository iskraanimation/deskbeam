[package]
name = "deskbeam-engine"
description = "DeskBeam's headless engine: command registry, snapshots and events over the iroh node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
deskbeam-model = { workspace = true }
deskbeam-store = { workspace = true }
deskbeam-tunnel = { workspace = true }
deskbeam-rdp = { workspace = true }
deskbeam-chat = { workspace = true }
deskbeam-call = { workspace = true }
deskbeam-lan = { workspace = true }
# The forked DashBeam crates, under the names their code uses.
native = { workspace = true }
protocol = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
gethostname = "1.1"
iroh = { workspace = true }
# Attachments: the blob store and protocol (as DashBeam's file transfer uses), stream
# helpers, and pictures for previews.
iroh-blobs = { workspace = true }
n0-future = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
data-encoding = "2.8.0"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# DashBeam's integration tests (moved from its `engine/tests`) and DeskBeam's own.
[dev-dependencies]
anyhow = { workspace = true }
deskbeam-lan = { workspace = true }
data-encoding = "2.8.0"
iroh-blobs = { workspace = true }
rand = "0.10"
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
