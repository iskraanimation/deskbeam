# Packages DeskBeam (plan §4, Packaging): the macOS .dmg and the Windows installer and .zip.
# Run by hand from the Actions tab, or by pushing a version tag (v0.1.0), which also makes a
# draft GitHub release with the files to check and publish.

name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  # wintun.dll for LAN mode: WireGuard's signed prebuilt, shipped unmodified next to
  # deskbeam.exe as its license allows. Changing the version means changing the checksum.
  WINTUN_VERSION: "0.14.1"
  WINTUN_SHA256: "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51"

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # OpenH264's x86 assembly, for the Intel half of the universal app.
      - run: brew install nasm
      - run: cargo xtask bundle
      - uses: actions/upload-artifact@v4
        with:
          name: deskbeam-macos
          path: target/bundle/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # OpenH264's x86 assembly (video calls); without it the build uses slower plain C.
      - name: NASM
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: cargo build --release --locked -p deskbeam

      - name: Version
        shell: pwsh
        run: |
          $version = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages |
            Where-Object name -eq "deskbeam" | Select-Object -ExpandProperty version
          "DESKBEAM_VERSION=$version" >> $env:GITHUB_ENV

      - name: wintun.dll
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\wintun.zip"
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-$env:WINTUN_VERSION.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:WINTUN_SHA256) { throw "wintun checksum is $hash, expected $env:WINTUN_SHA256" }
          Expand-Archive $zip "$env:RUNNER_TEMP\wintun"
          Copy-Item "$env:RUNNER_TEMP\wintun\wintun\bin\amd64\wintun.dll" target\release\
          Copy-Item "$env:RUNNER_TEMP\wintun\wintun\LICENSE.txt" target\release\wintun-LICENSE.txt

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DAppVersion=$env:DESKBEAM_VERSION" "/DBuildDir=$pwd\target\release" apps\deskbeam\packaging\windows\deskbeam.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }

      - name: Portable zip
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\DeskBeam"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target\release\deskbeam.exe, target\release\wintun.dll, target\release\wintun-LICENSE.txt $dir
          Copy-Item LICENSE "$dir\LICENSE.txt"
          Copy-Item NOTICE "$dir\NOTICE.txt"
          Compress-Archive $dir "target\release\DeskBeam-$env:DESKBEAM_VERSION-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: deskbeam-windows
          path: |
            target/release/DeskBeam-*-setup.exe
            target/release/DeskBeam-*-windows-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
