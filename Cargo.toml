[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# A plain `cargo run` starts the app. Build or test everything with `--workspace`
# (`cargo xtask ci` does).
default-members = ["apps/deskbeam"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.95"

[workspace.dependencies]
# internal
deskbeam-model = { path = "crates/deskbeam-model" }
deskbeam-store = { path = "crates/deskbeam-store" }
deskbeam-engine = { path = "crates/deskbeam-engine" }
deskbeam-tunnel = { path = "crates/deskbeam-tunnel" }
deskbeam-rdp = { path = "crates/deskbeam-rdp" }
deskbeam-chat = { path = "crates/deskbeam-chat" }
deskbeam-call = { path = "crates/deskbeam-call" }
deskbeam-lan = { path = "crates/deskbeam-lan" }
# The forked DashBeam crates. The keys are the names their code uses (`native::`, `protocol::`),
# so their sources stay as upstream wrote them and upstream fixes still apply as patches.
native = { package = "deskbeam-net", path = "crates/deskbeam-net" }
protocol = { package = "deskbeam-protocol", path = "crates/deskbeam-protocol" }

# external
anyhow = "1.0.75"
clap = { version = "4.4.10", features = ["derive"] }
dirs = "6.0.0"
eframe = { version = "0.36", default-features = false }
iroh = { version = "1.3.0", features = ["platform-verifier"] }
iroh-blobs = { version = "0.103.1" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.108"
tempfile = "3.8.1"
thiserror = "2"
tokio = { version = "1.34.0", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

# For DeskBeam's own crates. The forked ones keep their upstream settings.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Dependencies are optimized in debug builds too, so iroh's crypto and egui stay quick.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
strip = true
